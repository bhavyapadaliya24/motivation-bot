name: Daily Motivation Bot

on:
  schedule:
    # Runs every day at 6:00 AM IST = 12:30 AM UTC
    - cron: '30 0 * * *'
  workflow_dispatch:   # Allows you to run it manually from GitHub UI

jobs:
  send-motivation:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Needed to commit history file back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run motivation bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python app.py

      - name: Save history back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add motivation_history.json today_motivation.txt
          git diff --staged --quiet || git commit -m "chore: update motivation history [skip ci]"
          git push
